<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Try4</title>
    <link rel="stylesheet" href="./style.css">

  </head>
    
  <body>
  <header>
    <h1>Inventario de Medicamentos Homeopáticos</h1>
</header>
<main class="container">
    <section class="form-section">
        <div class="form-container">
            <h2>Ingreso de Medicamentos</h2>
            <form id="inventarioForm">
                <label for="nombre-medicamento">Nombre del Medicamento:</label>
                <input type="text" id="nombre-medicamento" name="nombre-medicamento" placeholder="Ej: Aconitum Napellus" required>
                <div id="sugerencias-nombre" class="sugerencias"></div>

                <label for="presentacion-med">Presentación:</label>
                <select id="presentacion-med" name="presentacion-med" required>
                    <option value="">-- Selecciona --</option>
                    <option value="gotas">Gotas</option>
                    <option value="globulos">Glóbulos</option>
                </select>

                <label for="dinamizacion-med">Nivel de dinamización:</label>
                <input type="text" id="dinamizacion-med" name="dinamizacion-med" placeholder="Ej: 30" required>

                <label for="tipo-dinamizacion-med">Tipo de dinamización:</label>
                <input type="text" id="tipo-dinamizacion-med" name="tipo-dinamizacion-med" placeholder="Ej: CH" required>

                <label for="cantidad-med">Cantidad a Ingresar:</label>
                <input type="number" id="cantidad-med" name="cantidad-med" required min="1">

                <label for="unidad-med">Unidad:</label>
                <select id="unidad-med" name="unidad-med" required>
                    <option value="">-- Selecciona --</option>
                    <option value="gr">gr</option>
                    <option value="ml">ml</option>
                    <option value="unidades">unidades</option>
                </select>

                <button type="submit">Registrar Ingreso</button>
            </form>
        </div>

        <div class="form-container">
            <h2>Despacho de Medicamentos</h2>
            <form id="despachoForm">
                <label for="despacho-nombre-med">Nombre del Medicamento:</label>
                <input type="text" id="despacho-nombre-med" name="despacho-nombre-med" placeholder="Ej: Aconitum Napellus" required>
                <div id="sugerencias-despacho" class="sugerencias"></div>

                <label for="despacho-presentacion-med">Presentación:</label>
                <select id="despacho-presentacion-med" name="despacho-presentacion-med" required>
                    <option value="">-- Selecciona --</option>
                    <option value="gotas">Gotas</option>
                    <option value="globulos">Glóbulos</option>
                </select>

                <label for="despacho-dinamizacion-med">Nivel de dinamización:</label>
                <input type="text" id="despacho-dinamizacion-med" name="despacho-dinamizacion-med" placeholder="Ej: 30" required>

                <label for="despacho-cantidad-med">Cantidad a Despachar:</label>
                <input type="number" id="despacho-cantidad-med" name="despacho-cantidad-med" required min="1">

                <label for="despacho-usuario">Usuario que Despacha:</label>
                <input type="text" id="despacho-usuario" name="despacho-usuario" placeholder="Nombre" required>

                <button type="submit">Registrar Despacho</button>
            </form>
        </div>
    </section>

<section class="historial-container">
    <h2>Historial de Movimientos</h2>
    <div class="historial-actions">
        <input type="text" id="filtroHistorial" placeholder="Filtrar por nombre...">
        <button id="descargarExcel">Descargar Historial</button>
        <button id="verHoja">Ver en Google Sheets</button>
    </div>
    <div class="table-container">
        <table id="tablaHistorial">
            <thead>
                <tr>
                    <th>Medicamento</th>
                    <th>Fecha</th>
                    <th>Presentación</th>
                    <th>Acción</th>
                    <th>Cantidad</th>
                    <th>Restante</th>
                    <th>Dinamización</th>
                    <th>Tipo de Dinamización</th>
                    <th>Usuario</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>
</section>
  
  


</main>
    <script  src="./script.js"></script>

  </body>
  
</html>
